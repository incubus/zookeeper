on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    name: Ruby ${{ matrix.ruby }} / GCC ${{ matrix.gcc }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'
        gcc:
          - latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up GCC
        if: ${{ matrix.gcc != 'latest' }}
        uses: egor-tensin/setup-gcc@v1
        with:
          version: ${{ matrix.gcc }}
          platform: x64

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: 1_${{ matrix.ruby }}_${{ matrix.os }}

      - name: Run Tests
        env:
          RAILS_ENV: test
          SPAWN_ZOOKEEPER: true
        run: |
          bundle exec rake

      - name: Build and verify gem
        env:
          RAILS_ENV: test
          SPAWN_ZOOKEEPER: false
        run: |
          gem build zookeeper.gemspec
          gem install ./zookeeper-*.gem
          ruby -e "require 'zookeeper'"
